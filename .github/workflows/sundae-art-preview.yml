name: Preview Sundae scenes
on:
  push:
    branches: [feat/sundae-switch-adventure]
    paths:
      - .github/workflows/sundae-art-preview.yml
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload scene illustrations for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: nine-sundae-scene-illustrations
          path: StuffyLand/Assets.xcassets/sundae-scene-*.imageset/*.jpg
          if-no-files-found: error
          retention-days: 2
